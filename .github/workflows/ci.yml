name: Quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-core
      - run: pip install -r apps/api/requirements-dev.txt
      - run: python -m pytest -q --cov=app --cov-report=term-missing
        working-directory: apps/api
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
        working-directory: apps/web
      - run: npm run typecheck && npm test && npm run build
        working-directory: apps/web
      - run: npm audit --audit-level=high
        working-directory: apps/web
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-core
      - run: python scripts/setup.py
      - run: pip install -r apps/api/requirements-dev.txt
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --env-file ../../.env --no-access-log > /tmp/studio-api.log 2>&1 &
        working-directory: apps/api
      - run: npm run test:e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: apps/web/test-results
